name: Deploy Marina Bay Sands

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check secrets exist
        run: |
          echo "SSH_HOST set: ${{ secrets.SSH_HOST != '' }}"
          echo "SSH_USER set: ${{ secrets.SSH_USER != '' }}"
          echo "SSH_PORT set: ${{ secrets.SSH_PORT != '' }}"
          echo "SSH_KEY set: ${{ secrets.SSH_PRIVATE_KEY != '' }}"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key || echo "WARNING: key may be invalid"

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'bash /var/app/sands/deploy.sh'
